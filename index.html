<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- TODO: Set the document title to the name of your application -->
  <title>Audit Ledger System</title>
  <meta name="description" content="Professional Enterprise Audit & Ledger System" />
  <meta name="author" content="" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="theme-color" content="#0f766e" />

  <meta property="og:title" content="Audit Ledger System" />
  <meta property="og:description" content="Secure and Professional Financial Management" />
  <meta property="og:type" content="website" />
  <script>
    (function () {
      function isWalletExtensionNoise(value) {
        var text = "";

        try {
          if (value && typeof value === "object") {
            text = [
              value.message,
              value.stack,
              value.reason && value.reason.message,
              value.reason && value.reason.stack,
              value.cause && value.cause.message,
              value.cause && value.cause.stack
            ].filter(Boolean).join(" ");
          } else {
            text = String(value || "");
          }
        } catch (_error) {
          text = String(value || "");
        }

        return /MetaMask|ethereum|inpage\.js|contentscript\.js|Failed to connect to MetaMask|MetaMask extension not found/i.test(text);
      }

      window.addEventListener("error", function (event) {
        if (
          isWalletExtensionNoise(event.error) ||
          isWalletExtensionNoise(event.message) ||
          isWalletExtensionNoise(event.filename)
        ) {
          event.preventDefault();
        }
      }, true);

      window.addEventListener("unhandledrejection", function (event) {
        if (isWalletExtensionNoise(event.reason)) {
          event.preventDefault();
        }
      }, true);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
